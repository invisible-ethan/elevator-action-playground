<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#000018" />
    <title>Elevator Action</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        background: #05050c;
        overflow: hidden;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      #screen {
        display: block;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        background: #000;
      }
      #pad {
        display: none;
      }
      body.touch #pad {
        display: flex;
        width: 100%;
        max-width: 560px;
        justify-content: space-between;
        align-items: center;
        padding: 12px 18px;
        gap: 12px;
      }
      .dpad {
        display: grid;
        grid-template-columns: repeat(3, 52px);
        grid-template-rows: repeat(3, 52px);
      }
      .btn {
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 10px;
        background: #22223a;
        color: #d0d0ff;
        font: bold 14px monospace;
        border: 2px solid #44446a;
      }
      .btn.active {
        background: #4a4a80;
      }
      .dpad .up { grid-column: 2; grid-row: 1; }
      .dpad .left { grid-column: 1; grid-row: 2; }
      .dpad .right { grid-column: 3; grid-row: 2; }
      .dpad .down { grid-column: 2; grid-row: 3; }
      .actions {
        display: grid;
        grid-template-columns: repeat(2, 68px);
        grid-template-rows: 40px 68px;
        gap: 10px;
      }
      .actions .round {
        border-radius: 50%;
      }
      .actions .fire { background: #6a1a2a; border-color: #a03048; color: #ffd0d8; }
      .actions .jump { background: #1a4a6a; border-color: #3080a0; color: #d0f0ff; }
    </style>
  </head>
  <body>
    <canvas id="screen" width="256" height="224" aria-label="Elevator Action game screen"></canvas>
    <div id="pad">
      <div class="dpad">
        <div class="btn up" data-action="up">▲</div>
        <div class="btn left" data-action="left">◀</div>
        <div class="btn right" data-action="right">▶</div>
        <div class="btn down" data-action="down">▼</div>
      </div>
      <div class="actions">
        <div class="btn" data-action="start">START</div>
        <div class="btn" data-action="pause">PAUSE</div>
        <div class="btn round jump" data-action="jump">JUMP</div>
        <div class="btn round fire" data-action="fire">FIRE</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
